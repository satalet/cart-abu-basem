<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد زربا (أبو باسم) - كرت شخصي فاخر</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .card-container {
            background: #1e293b;
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid #334155;
            text-align: center;
            position: relative;
        }
        .header-bg {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            height: 130px;
            width: 100%;
        }
        .profile-img-container {
            position: relative;
            margin: -65px auto 15px;
            width: 130px;
            height: 130px;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #1e293b;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            object-fit: cover;
        }
        .verified-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #22c55e;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 3px solid #1e293b;
        }
        .card-body {
            padding: 0 25px 30px;
        }
        h1 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 5px;
            font-weight: 800;
        }
        .nickname {
            color: #cbd5e1;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .location-info {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(51, 65, 85, 0.5);
            padding: 8px;
            border-radius: 10px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .btn-vcf {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            font-size: 16px;
            padding: 16px;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
        .btn-whatsapp {
            background-color: #22c55e;
            color: #ffffff;
        }
        .btn-call {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
        }
        .btn-facebook {
            background-color: #1877f2;
            color: #ffffff;
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-3px);
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        /* إظهار الأرقام بوضوح تحت الزر */
        .phone-number-display {
            font-size: 13px;
            color: #94a3b8;
            font-weight: normal;
            margin-top: -1px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header-bg"></div>
        <div class="profile-img-container">
            <!-- الصورة المعدلة الرسمية -->
            <img src="profile.png" alt="محمد زربا" class="profile-img">
            <div class="verified-badge">
                <i class="fa-solid fa-check"></i>
            </div>
        </div>
        <div class="card-body">
            <h1>محمد زربا</h1>
            <div class="nickname">(أبو باسم)</div>
            <div class="subtitle">فني تركيب وصيانة كاميرات مراقبة وستلايت</div>
            
            <div class="location-info">
                <i class="fa-solid fa-location-dot" style="color: #ef4444;"></i>
                <span>الرام - ضواحي القدس</span>
            </div>

            <div class="action-buttons">
                <!-- زر حفظ جهة الاتصال الذكي -->
                <a href="contact.vcf" class="btn btn-vcf">
                    <i class="fa-solid fa-address-card"></i> حفظ الكرت في الهاتف
                </a>
                
                <!-- أزرار الواتساب مع الأرقام -->
                <div class="btn-group">
                    <div class="btn-wrapper">
                        <a href="https://wa.me/972534829927" target="_blank" class="btn btn-whatsapp">
                            <i class="fa-brands fa-whatsapp"></i> واتساب 1
                        </a>
                        <span class="phone-number-display">053-482-9927</span>
                    </div>
                    <div class="btn-wrapper">
                        <a href="https://wa.me/972521234687" target="_blank" class="btn btn-whatsapp">
                            <i class="fa-brands fa-whatsapp"></i> واتساب 2
                        </a>
                        <span class="phone-number-display">052-123-4687</span>
                    </div>
                </div>

                <!-- أزرار الاتصال مع الأرقام -->
                <div class="btn-group">
                    <div class="btn-wrapper">
                        <a href="tel:0534829927" class="btn btn-call">
                            <i class="fa-solid fa-phone"></i> اتصل هاتف
                        </a>
                        <span class="phone-number-display">053-482-9927</span>
                    </div>
                    <div class="btn-wrapper">
                        <a href="tel:0592973116" class="btn btn-call">
                            <i class="fa-solid fa-mobile-screen"></i> اتصل جوّال
                        </a>
                        <span class="phone-number-display">059-297-3116</span>
                    </div>
                </div>

                <!-- زر الفيسبوك -->
                <a href="https://www.facebook.com/satalet/?locale=ar_AR" target="_blank" class="btn btn-facebook">
                    <i class="fa-brands fa-facebook"></i> صفحة الفيسبوك
                </a>
            </div>
        </div>
    </div>

</body>
</html>
