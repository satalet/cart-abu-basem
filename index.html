<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#030712">

    <!-- Facebook / WhatsApp Open Graph -->
    <meta property="og:title" content="الباسم سات | محمد زربا (أبو باسم)">
    <meta property="og:description" content="فني تركيب وصيانة كاميرات المراقبة والستلايت - الرام وضواحي القدس">
    <meta property="og:image" content="https://satalet.github.io/cart-abu-basem/poster.jpg">

    <meta property="og:locale" content="ar_AR">

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://mohmmad.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <style>
        :root {
            --bg-base: #030712;
            --card-surface: rgba(15, 23, 42, 0.78);
            --card-border: rgba(56, 189, 248, 0.2);
            --neon-blue: #38bdf8;
            --neon-green: #22c55e;
            --neon-amber: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.16) 0%, transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(34, 197, 94, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 0% 100%, rgba(56, 189, 248, 0.06) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 14px;
            color: var(--text-primary);
        }

        .card-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 26px 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 30px rgba(56, 189, 248, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* لمعة معدنية خفيفة تمر بالخلفية */
        .card-container::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: linear-gradient(45deg, transparent 46%, rgba(255, 255, 255, 0.035) 50%, transparent 54%);
            animation: cardShimmer 10s infinite linear;
            pointer-events: none;
        }

        @keyframes cardShimmer {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        /* بادج الحالة المباشرة */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            color: #4ade80;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* الهيدر والبروفايل */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-img-container {
            position: relative;
            width: 104px;
            height: 104px;
            margin-bottom: 12px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
            background: #0f172a;
        }

        .verified-badge {
            position: absolute;
            bottom: 3px;
            right: 3px;
            background: #0284c7;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            border: 2px solid var(--bg-base);
        }

        h1 {
            font-size: 1.48rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        .nickname {
            font-size: 0.95rem;
            color: var(--neon-blue);
            font-weight: 700;
            margin-top: 2px;
        }

        .subtitle {
            font-size: 0.84rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 4px;
        }

        /* زر حفظ الكرت الرئيسي المتوهج */
        .btn-save-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.96rem;
            padding: 13px 18px;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
            margin: 20px 0 16px;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-save-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(2, 132, 199, 0.5);
            color: #fff;
        }

        /* شبكة أزرار التواصل الذكية (Cyber Grid) */
        .circle-buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
            margin-bottom: 16px;
        }

        .circle-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 11px 13px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .circle-btn:hover, .circle-btn:active {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(56, 189, 248, 0.35);
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-content {
            display: flex;
            flex-direction: column;
            text-align: right;
            overflow: hidden;
        }

        .btn-content span {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .btn-content small {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 1px;
            direction: ltr;
            text-align: right;
        }

        /* ألوان الأيقونات الفردية */
        .whatsapp-glow { background: rgba(34, 197, 94, 0.14); color: #22c55e; }
        .phone-glow { background: rgba(56, 189, 248, 0.14); color: #38bdf8; }
        .fb-glow { background: rgba(59, 130, 246, 0.14); color: #60a5fa; }
        .map-glow { background: rgba(245, 158, 11, 0.14); color: #fbbf24; }

        /* زر المشاركة السفلي */
        .btn-share-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 11px;
            border-radius: 16px;
            color: var(--text-secondary);
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-share-card:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--neon-blue);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.72rem;
            color: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>

<body>

<main class="card-container">

    </div>

    <!-- زر مشاركة الكرت مع التتبع -->
    <button type="button" class="btn-share-card" onclick="shareCard()">

</main>

<script>
async function shareCard() {
    if (window.goatcounter) {
        window.goatcounter.count({
            path: "share-card"
        });
    }

    const shareData = {
        title: "الباسم سات | محمد زربا (أبو باسم)",
        text: "الباسم سات - تركيب وصيانة كاميرات المراقبة والستلايت | الرام وضواحي القدس",
        url: "https://satalet.github.io/cart-abu-basem/"
    };

    if (navigator.share) {
        try {
            await navigator.share(shareData);
        } catch (error) {}
    } else {
        try {
            await navigator.clipboard.writeText("https://satalet.github.io/cart-abu-basem/");
            alert("تم نسخ رابط الكرت 👍\nيمكنك الآن إرساله لأي شخص.");
        } catch (error) {
            prompt("انسخ رابط الكرت:", "https://satalet.github.io/cart-abu-basem/");
        }
    }
}
</script>
