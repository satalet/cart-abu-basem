<script>
async function shareCard() {
    if (window.goatcounter) {
        window.goatcounter.count({
            path: "share-card"
        });
    }

    const shareData = {
        title: "الباسم سات | محمد زربا (أبو باسم)",
        text: "الباسم سات - تركيب وصيانة كاميرات المراقبة والستلايت | الرام وضواحي القدس",
        url: "https://satalet.github.io/cart-abu-basem/"
    };

    if (navigator.share) {
        try {
            await navigator.share(shareData);
        } catch (error) {}
    } else {
        try {
            await navigator.clipboard.writeText("https://satalet.github.io/cart-abu-basem/");
            alert("تم نسخ رابط الكرت 👍\nيمكنك الآن إرساله لأي شخص.");

        }
    }
}
