<script>

async function shareCard() {

    /*
     * تسجيل ضغط زر المشاركة
     */

    if (window.goatcounter) {

        window.goatcounter.count({
            path: "share-card"
        });

    }


    const shareData = {

        title:
            "الباسم سات | محمد زربا (أبو باسم)",

        text:
            "الباسم سات - تركيب وصيانة كاميرات المراقبة والستلايت | الرام وضواحي القدس",

        url:
            "https://satalet.github.io/cart-abu-basem/"

    };


    /*
     * مشاركة الهاتف الأصلية
     */

    if (navigator.share) {

        try {

            await navigator.share(shareData);

        }

        catch (error) {

            /*
             * المستخدم أغلق نافذة المشاركة
             */

        }

    }


    /*
     * الأجهزة التي لا تدعم المشاركة
     */

    else {

        try {

            await navigator.clipboard.writeText(
                "https://satalet.github.io/cart-abu-basem/"
            );

            alert(
                "تم نسخ رابط الكرت 👍\nيمكنك الآن إرساله لأي شخص."
            );

        }

        catch (error) {

            prompt(
                "انسخ رابط الكرت:",
                "https://satalet.github.io/cart-abu-basem/"
            );

        }

    }

}
