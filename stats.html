<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex,nofollow">

    <title>إحصائيات الباسم سات | أبو باسم</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #0f172a 45%,
                    #020617 100%
                );

            color: #f8fafc;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 1100px;

            margin: auto;
        }


        /* =========================
           Header
        ========================== */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #0369a1
                );

            border-radius: 24px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.45);

            border: 1px solid
                rgba(255,255,255,0.08);
        }


        .header h1 {

            font-size: 28px;

            margin-bottom: 7px;
        }


        .header p {

            color: #dbeafe;

            font-size: 14px;
        }


        .header .badge {

            display: inline-block;

            margin-top: 14px;

            background:
                rgba(255,255,255,0.15);

            padding: 7px 13px;

            border-radius: 50px;

            font-size: 12px;
        }


        /* =========================
           Cards
        ========================== */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }


        .card {

            background:
                rgba(30,41,59,0.95);

            border: 1px solid #334155;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.30);
        }


        .card .icon {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background:
                rgba(56,189,248,0.12);

            font-size: 22px;

            margin-bottom: 12px;
        }


        .card h3 {

            color: #94a3b8;

            font-size: 13px;

            font-weight: 500;

            margin-bottom: 7px;
        }


        .number {

            font-size: 29px;

            font-weight: 800;

            color: #f8fafc;
        }


        /* =========================
           Main dashboard
        ========================== */

        .section {

            background:
                rgba(30,41,59,0.95);

            border: 1px solid #334155;

            border-radius: 22px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.30);
        }


        .section-title {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 15px;
        }


        .section-title h2 {

            font-size: 19px;
        }


        .section-title span {

            color: #64748b;

            font-size: 12px;
        }


        /* =========================
           GoatCounter iframe
        ========================== */

        .dashboard-frame {

            width: 100%;

            height: 720px;

            border: 0;

            border-radius: 15px;

            background: #ffffff;
        }


        /* =========================
           Quick buttons
        ========================== */

        .quick-buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }


        .quick-button {

            text-decoration: none;

            color: #f8fafc;

            background:
                #334155;

            border: 1px solid #475569;

            border-radius: 14px;

            padding: 15px;

            text-align: center;

            transition: 0.2s;
        }


        .quick-button:hover {

            transform:
                translateY(-3px);

            background:
                #475569;
        }


        /* =========================
           Footer
        ========================== */

        .footer {

            text-align: center;

            color: #64748b;

            font-size: 12px;

            padding: 15px;
        }


        /* =========================
           Mobile
        ========================== */

        @media (max-width: 800px) {

            .cards {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .quick-buttons {

                grid-template-columns:
                    1fr;
            }


            .dashboard-frame {

                height: 650px;
            }

        }


        @media (max-width: 480px) {

            body {

                padding: 10px;
            }


            .header {

                padding: 20px;
            }


            .header h1 {

                font-size: 23px;
            }


            .cards {

                grid-template-columns:
                    1fr 1fr;

                gap: 10px;
            }


            .card {

                padding: 15px;
            }


            .number {

                font-size: 24px;
            }


            .dashboard-frame {

                height: 600px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         Header
    ========================== -->

    <header class="header">

        <h1>
            📊 لوحة إحصائيات الباسم سات
        </h1>

        <p>
            محمد زربا — أبو باسم
        </p>

        <div class="badge">
            🔒 لوحة الإدارة الخاصة
        </div>

    </header>


    <!-- =========================
         Summary Cards
    ========================== -->

    <div class="cards">


        <div class="card">

            <div class="icon">
                👁️
            </div>

            <h3>
                زيارات الكرت
            </h3>

            <div class="number">
                —
            </div>

        </div>


        <div class="card">

            <div class="icon">
                🟢
            </div>

            <h3>
                ضغطات واتساب
            </h3>

            <div class="number">
                —
            </div>

        </div>


        <div class="card">

            <div class="icon">
                📞
            </div>

            <h3>
                ضغطات الاتصال
            </h3>

            <div class="number">
                —
            </div>

        </div>


        <div class="card">

            <div class="icon">
                📤
            </div>

            <h3>
                مشاركة الكرت
            </h3>

            <div class="number">
                —
            </div>

        </div>


    </div>


    <!-- =========================
         GoatCounter
    ========================== -->

    <section class="section">

        <div class="section-title">

            <h2>
                📈 الإحصائيات التفصيلية
            </h2>

            <span>
                GoatCounter
            </span>

        </div>


        <iframe
            class="dashboard-frame"
            src="https://albasem-sat.goatcounter.com/"
            title="إحصائيات الباسم سات"
            loading="lazy">
        </iframe>

    </section>


    <!-- =========================
         Quick Links
    ========================== -->

    <section class="section">

        <div class="section-title">

            <h2>
                ⚡ روابط سريعة
            </h2>

        </div>


        <div class="quick-buttons">


            <a
                class="quick-button"
                href="https://satalet.github.io/cart-abu-basem/"
                target="_blank">

                🌐 فتح الكرت

            </a>


            <a
                class="quick-button"
                href="https://albasem-sat.goatcounter.com/"
                target="_blank">

                📊 فتح GoatCounter

            </a>


            <a
                class="quick-button"
                href="https://satalet.github.io/cart-abu-basem/"
                target="_blank">

                📱 معاينة نسخة الهاتف

            </a>


        </div>

    </section>


    <div class="footer">

        الباسم سات ©
        <span id="year"></span>

        <br>

        لوحة إحصائيات أبو باسم

    </div>


</div>


<script>

    document.getElementById("year").textContent =
        new Date().getFullYear();

</script>


</body>

</html>
